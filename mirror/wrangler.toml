name = "poap-mirror"
main = "worker.js"
compatibility_date = "2026-08-01"

[vars]
WRITES_OPEN = "1"

[[r2_buckets]]
binding = "MIRROR"
bucket_name = "poap-mirror"

# Per-IP ingest limit. Ingest is the only write path; a flood would otherwise
# fill the storage cap and 507-lock the mirror for everyone.
[[unsafe.bindings]]
name = "INGEST_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Daily reconciliation of the usage ledger against the real bucket listing.
[triggers]
crons = ["17 4 * * *"]
