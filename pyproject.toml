[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poap-saver"
version = "1.1.2"
description = "Save the metadata and artwork your POAP badges point at, before it disappears."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

[project.urls]
Homepage = "https://github.com/mdws-org/poap-saver"

[project.scripts]
poap-saver = "poap_saver:main"

[tool.hatch.build.targets.wheel]
packages = ["poap_saver"]

# The gallery template's canonical copy lives in web/ (the browser app fetches
# it from beside itself); the wheel carries a copy inside the package so an
# installed CLI needs no repo checkout.
[tool.hatch.build.targets.wheel.force-include]
"web/gallery-template.html" = "poap_saver/gallery-template.html"
